<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PixelForge — editor de sprites</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">▦</span>
        <span class="brand-name">PixelForge</span>
      </div>

      <div class="sprite-controls">
        <input id="sprite-id" type="text" placeholder="id-do-sprite" value="novo_sprite" />
        <input id="sprite-w" type="number" min="1" max="4096" value="40" title="largura" />
        <span class="dim-x">×</span>
        <input id="sprite-h" type="number" min="1" max="4096" value="40" title="altura" />
        <button id="btn-new" class="btn">Novo</button>
        <button id="btn-load" class="btn">Abrir</button>
        <button id="btn-save" class="btn btn-primary">Salvar</button>
      </div>

      <div class="export-controls">
        <label for="export-scale">Export ×</label>
        <select id="export-scale">
          <option value="1">1</option>
          <option value="4">4</option>
          <option value="8" selected>8</option>
          <option value="16">16</option>
        </select>
        <button id="btn-export" class="btn btn-accent">Exportar PNG</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel tools">
        <h3>Ferramentas</h3>
        <button class="tool-btn active" data-tool="pencil" title="Lápis (1px)">✏️ Lápis</button>
        <button class="tool-btn" data-tool="fill" title="Balde">🪣 Balde</button>
        <button class="tool-btn" data-tool="eyedropper" title="Conta-gotas">💧 Conta-gotas</button>
        <button class="tool-btn" data-tool="eraser" title="Borracha (transparente)">⌫ Borracha</button>

        <label class="toggle">
          <input type="checkbox" id="mirror-x" />
          Espelho vertical (eixo X)
        </label>

        <label class="toggle">
          <input type="checkbox" id="axis-lock" />
          Trava de eixo (linha reta)
        </label>

        <h3>Pincel</h3>
        <input id="brush-size" type="range" min="1" max="8" value="1" />
        <span id="brush-size-label">1px</span>

        <h3>Referência (decalque)</h3>
        <input id="ref-file" type="file" accept="image/*" />
        <label class="toggle">
          <input type="checkbox" id="ref-visible" checked />
          Mostrar referência
        </label>
        <input id="ref-opacity" type="range" min="0" max="100" value="50" />
        <span id="ref-opacity-label">50%</span>
        <button id="btn-ref-clear" class="btn">Remover referência</button>
        <button id="btn-extract-palette" class="btn btn-primary">🎨 Extrair paleta da referência</button>

        <h3>Zoom</h3>
        <input id="zoom" type="range" min="4" max="32" value="14" />
        <span id="zoom-label">14×</span>

        <h3>Fundo do canvas</h3>
        <select id="canvas-bg">
          <option value="dark" selected>Escuro (padrão)</option>
          <option value="light">Claro</option>
          <option value="white">Branco sólido</option>
          <option value="black">Preto sólido</option>
        </select>

        <h3>Grade (grid)</h3>
        <label class="toggle">
          <input type="checkbox" id="grid-visible" checked />
          Mostrar grade
        </label>
        <input id="grid-spacing" type="range" min="1" max="8" value="1" />
        <span id="grid-spacing-label">a cada 1px</span>

        <h3>Ações</h3>
        <button id="btn-undo" class="btn">↶ Desfazer</button>
        <button id="btn-redo" class="btn">↷ Refazer</button>
        <button id="btn-clear" class="btn btn-danger">Limpar canvas</button>
      </aside>

      <section class="canvas-area">
        <div id="canvas-wrap" class="canvas-wrap">
          <canvas id="checker" ></canvas>
          <canvas id="reference"></canvas>
          <canvas id="sprite-canvas"></canvas>
          <canvas id="grid"></canvas>
        </div>
        <div class="statusbar">
          <span id="cursor-pos">x: -, y: -</span>
          <span id="canvas-dims"></span>
        </div>
      </section>

      <aside class="panel palette">
        <h3>Paleta <span id="palette-count" class="muted"></span></h3>
        <div id="palette-grid" class="palette-grid"></div>
        <div class="palette-add">
          <input id="new-color" type="color" value="#ff0055" />
          <button id="btn-add-color" class="btn">+ Adicionar</button>
        </div>

        <h3>Análise</h3>
        <button id="btn-analyze" class="btn">Analisar sprite</button>
        <pre id="analyze-out" class="analyze-out"></pre>
      </aside>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
