# Config do Nginx para forgegrid.com.br — PRONTA, mas NÃO ATIVA ainda.
#
# Domínio comprado (17/08/2026) e ainda em status "registrando" no
# registro.br, sem DNS apontado pra VPS. Este arquivo fica parado aqui
# até o domínio estar liberado e o DNS (registro.br) apontando pro IP
# da VPS (89.116.225.87). Enquanto isso, o site continua servindo só
# por IP, sem alteração nenhuma na VPS.
#
# Quando o domínio estiver ativo e o DNS propagado (confirmar com
# `dig forgegrid.com.br` mostrando 89.116.225.87), ativar assim:
#
#   1. Copiar este arquivo pra VPS:
#      scp deploy/nginx-forgegrid.conf root@89.116.225.87:/etc/nginx/sites-available/forgegrid
#
#   2. Ativar o site e desativar o antigo (por IP):
#      ln -s /etc/nginx/sites-available/forgegrid /etc/nginx/sites-enabled/
#      rm -f /etc/nginx/sites-enabled/pixelforge   # ou o nome usado antes
#      nginx -t && systemctl restart nginx
#
#   3. Emitir HTTPS de verdade:
#      apt install -y certbot python3-certbot-nginx
#      certbot --nginx -d forgegrid.com.br -d www.forgegrid.com.br
#      (o certbot edita este bloco sozinho pra redirecionar HTTP -> HTTPS)

server {
    listen 80;
    listen [::]:80;
    server_name forgegrid.com.br www.forgegrid.com.br;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
